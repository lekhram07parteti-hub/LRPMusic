name: Build LRP Music APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
  
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Build with Gradle (Dummy APK)
      run: |
        mkdir -p app/build/outputs/apk/debug/
        echo "LRP Music Mock APK" > app/build/outputs/apk/debug/lrp-music-debug.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: lrp-music-apk
        path: app/build/outputs/apk/debug/lrp-music-apk.apk


    
        name: lrp-music-apk
        path: app/build/outputs/apk/debug/lrp-music-apk.apk
